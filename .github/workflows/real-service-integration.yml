name: Disposable Supabase real-service integration

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - claude/careconnect-frontend-repair
    paths:
      - ".github/workflows/real-service-integration.yml"
      - "scripts/real-service-integration.mjs"
      - "scripts/real-service-integration.test.mjs"
      - "scripts/verify-disposable-docker-bindings.mjs"
      - "scripts/verify-disposable-docker-bindings.test.mjs"
      - "scripts/startup-evidence.mjs"
      - "scripts/startup-evidence.test.mjs"
      - "scripts/startup-observer.mjs"
      - "scripts/startup-observer.test.mjs"
      - "scripts/service-execution-boundary*.mjs"
      - "scripts/ci-docker-admission*.mjs"
      - "scripts/ci-isolated-docker.sh"
      - "scripts/ci-real-service-phase.sh"
      - "scripts/staging-reconciliation-rehearsal.mjs"
      - "scripts/staging-reconciliation-rehearsal.test.mjs"
      - "tests/real-service/**"
      - "playwright.real-service.config.ts"
      - "vite.config.ts"
      - "nitro.config.ts"
      - "tsconfig.json"
      - "index.html"
      - "public/**"
      - "scripts/migration-integrity.json"
      - "scripts/run-sql-ci-step*.mjs"
      - "scripts/local-sql-test-target*.mjs"
      - "scripts/test-booking-concurrency.mjs"
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: careconnect-real-service-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-service-integration:
    name: Fresh local Supabase services and real browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require the reviewed branch and a GitHub-hosted Linux runner
        shell: bash
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]] || exit 78
          [[ "$GITHUB_REF" == refs/heads/claude/careconnect-frontend-repair ]] || exit 78
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || exit 78

      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Install namespace transport and PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes slirp4netns postgresql-client

      - name: Install Chromium into the run's browser cache
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/careconnect-chromium
        run: npx playwright install --with-deps chromium

      - name: Validate pre-start, startup and cleanup regressions
        run: node --test scripts/ci-docker-admission.test.mjs scripts/service-execution-boundary.test.mjs scripts/real-service-integration.test.mjs scripts/verify-disposable-docker-bindings.test.mjs scripts/startup-evidence.test.mjs scripts/startup-observer.test.mjs scripts/run-sql-ci-step.test.mjs scripts/local-sql-test-target.test.mjs

      - name: Prove private Docker isolation and exercise real services
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          status=0
          sudo -n /bin/bash scripts/ci-isolated-docker.sh \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$(id -u)" "$(id -g)" \
            "$(pwd -P)" "$(command -v node)" "$(command -v supabase)" "$RUNNER_TEMP/careconnect-chromium" || status=$?
          if [[ ! -f test-artifacts/service-execution-boundary.json && "$status" == 78 ]]; then
            node scripts/service-execution-boundary.mjs
          fi
          exit "$status"

      - name: Upload sanitized integration evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careconnect-real-service-${{ github.run_id }}
          path: |
            test-artifacts/service-execution-boundary.json
            test-artifacts/docker-pre-start-proof.json
            test-artifacts/startup.log
            test-artifacts/startup-process.json
            test-artifacts/startup-images-before.json
            test-artifacts/startup-evidence.json
            test-artifacts/startup-observer.json
            test-artifacts/startup-observer-cleanup.json
            test-artifacts/ledger.log
            test-artifacts/pgtap.log
            test-artifacts/concurrency.log
            test-artifacts/real-service-summary.json
            test-artifacts/browser-workflow-summary.json
            test-artifacts/browser-failure-trace.json
            test-artifacts/docker-network-summary.json
            test-artifacts/docker-network-cleanup-summary.json
            test-artifacts/docker-stop-summary.json
          if-no-files-found: warn
          retention-days: 7
