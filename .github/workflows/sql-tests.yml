name: Isolated CareConnect SQL tests

on:
  push:
    branches:
      - claude/careconnect-frontend-repair
    paths:
      - ".github/workflows/sql-tests.yml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careconnect-sql-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-tests:
    name: Fresh local Supabase database and pgTAP suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Assert this job is unlinked and has no remote credentials
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e supabase/.temp/linked-project.json
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          supabase --version
          supabase init --yes
          test -f supabase/config.toml

      - name: Start disposable local Supabase stack
        shell: bash
        run: |
          mkdir -p test-artifacts
          raw_log="$RUNNER_TEMP/careconnect-supabase-start.raw.log"
          set +e
          supabase start >"$raw_log" 2>&1
          start_status=$?
          set -e
          sed -E 's/([[:space:]]*(JWT secret|anon key|service_role key|publishable key|secret key|DB URL|S3 Access Key|S3 Secret Key):).*/\1 [REDACTED]/I' "$raw_log" \
            | tee test-artifacts/supabase-start.log
          if [ "$start_status" -ne 0 ]; then
            exit "$start_status"
          fi

      - name: Record local migration ledger
        shell: bash
        run: |
          set -o pipefail
          supabase migration list --local 2>&1 | tee test-artifacts/migration-list.log

      - name: Run SQL tests 001–016 against the local database
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/*.test.sql --local 2>&1 | tee test-artifacts/pgtap.log

      - name: Preserve migration and test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careconnect-sql-test-logs-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7

# Re-run isolated SQL validation after Supabase query optimizations
