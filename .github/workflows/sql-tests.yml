name: Isolated CareConnect SQL tests

on:
  push:
    branches:
      - claude/careconnect-frontend-repair
    paths:
      - ".github/workflows/sql-tests.yml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/test-booking-concurrency.mjs"
      - "scripts/run-sql-ci-step*.mjs"
      - "scripts/local-sql-test-target*.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careconnect-sql-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-tests:
    name: Fresh local Supabase database and pgTAP suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Test the allow-listed CI summaries and local target guard
        run: node --test scripts/run-sql-ci-step.test.mjs scripts/local-sql-test-target.test.mjs

      - name: Assert this job is unlinked and has no remote credentials
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e supabase/.temp/linked-project.json
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          supabase --version
          supabase init --yes
          test -f supabase/config.toml

      - name: Start disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/run-sql-ci-step.mjs startup

      - name: Record local migration ledger
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-sql-ci-step.mjs ledger

      - name: Run SQL tests against the local database
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-sql-ci-step.mjs pgtap

      - name: Run two-session booking limit regression against local database
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /usr/bin/psql ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          test -x /usr/bin/psql
          node scripts/run-sql-ci-step.mjs concurrency

      - name: Preserve migration and test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careconnect-sql-test-logs-${{ github.run_id }}
          path: |
            test-artifacts/startup.log
            test-artifacts/ledger.log
            test-artifacts/pgtap.log
            test-artifacts/concurrency.log
          if-no-files-found: warn
          retention-days: 7

# Re-run isolated SQL validation after Supabase query optimizations
