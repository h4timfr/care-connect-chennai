name: Disposable staging-state reconciliation rehearsal

on:
  push:
    branches:
      - claude/careconnect-frontend-repair
    paths:
      - ".github/workflows/staging-reconciliation-rehearsal.yml"
      - "scripts/staging-reconciliation-rehearsal*.mjs"
      - "scripts/migration-integrity.json"
      - "vercel.json"
      - "scripts/run-sql-ci-step*.mjs"
      - "scripts/local-sql-test-target*.mjs"
      - "scripts/test-booking-concurrency.mjs"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careconnect-staging-state-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Timestamp-ledger normalization, full chain, and recovery on local Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Install PostgreSQL client for isolated local checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          test -x /usr/bin/psql

      - name: Run rehearsal guard/unit tests
        run: node --test scripts/staging-reconciliation-rehearsal.test.mjs scripts/local-sql-test-target.test.mjs scripts/run-sql-ci-step.test.mjs

      - name: Rehearse staging timestamp-ledger normalization and all migrations
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/staging-reconciliation-rehearsal.mjs --execute

      - name: Preserve only sanitized summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careconnect-staging-state-rehearsal-${{ github.run_id }}
          path: |
            test-artifacts/staging-reconciliation.log
            test-artifacts/rehearsal-failure.log
            test-artifacts/ledger.log
            test-artifacts/pgtap.log
            test-artifacts/concurrency.log
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Final-source frontend and mocked Chromium validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Run frontend checks using reserved build-only configuration
        env:
          VITE_SUPABASE_URL: https://careconnect-ci-build.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
        run: npm run validate:frontend && npm run test:supabase-config
      - name: Install Chromium on the disposable runner
        run: npx playwright install --with-deps chromium
      - name: Run complete mocked Chromium suite with its own reserved configuration
        run: npx playwright test --project=chromium
