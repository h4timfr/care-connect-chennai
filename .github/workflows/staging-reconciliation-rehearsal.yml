name: Disposable staging-state reconciliation rehearsal

on:
  push:
    branches:
      - claude/careconnect-frontend-repair
    paths:
      - ".github/workflows/staging-reconciliation-rehearsal.yml"
      - "scripts/staging-reconciliation-rehearsal*.mjs"
      - "scripts/ci-isolated-docker.sh"
      - "scripts/ci-real-service-phase.sh"
      - "scripts/ci-docker-admission*.mjs"
      - "scripts/service-execution-boundary*.mjs"
      - "scripts/compare-staging-baseline*.mjs"
      - "scripts/migration-integrity.json"
      - "scripts/staging-readonly-inventory.sql"
      - "vercel.json"
      - "scripts/run-sql-ci-step*.mjs"
      - "scripts/local-sql-test-target*.mjs"
      - "scripts/test-booking-concurrency.mjs"
      - "playwright.config.ts"
      - "tests/deferred-toast.spec.ts"
      - "src/components/DeferredToaster.tsx"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careconnect-staging-state-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Timestamp-ledger normalization, full chain, and recovery on local Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require the reviewed branch and a GitHub-hosted Linux runner
        shell: bash
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]] || exit 78
          [[ "$GITHUB_REF" == refs/heads/claude/careconnect-frontend-repair ]] || exit 78
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || exit 78

      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Install PostgreSQL client for isolated local checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes slirp4netns postgresql-client
          test -x /usr/bin/psql

      - name: Run rehearsal guard/unit tests
        run: node --test scripts/compare-staging-baseline.test.mjs scripts/staging-reconciliation-rehearsal.test.mjs scripts/local-sql-test-target.test.mjs scripts/run-sql-ci-step.test.mjs scripts/service-execution-boundary.test.mjs scripts/ci-docker-admission.test.mjs

      - name: Rehearse staging timestamp-ledger normalization and all migrations
        shell: bash
        run: |
          set -euo pipefail
          empty_browser_cache=$(mktemp -d "$RUNNER_TEMP/rehearsal-browser-cache.XXXXXXXX")
          status=0
          sudo -n /bin/bash scripts/ci-isolated-docker.sh \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$(id -u)" "$(id -g)" \
            "$(pwd -P)" "$(command -v node)" "$(command -v supabase)" "$empty_browser_cache" reconciliation || status=$?
          if [[ ! -f test-artifacts/service-execution-boundary.json && "$status" == 78 ]]; then
            node scripts/service-execution-boundary.mjs
          fi
          exit "$status"

      - name: Preserve only sanitized summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careconnect-staging-state-rehearsal-${{ github.run_id }}
          path: |
            test-artifacts/service-execution-boundary.json
            test-artifacts/docker-pre-start-proof.json
            test-artifacts/docker-network-summary.json
            test-artifacts/docker-stop-summary.json
            test-artifacts/docker-network-cleanup-summary.json
            test-artifacts/staging-reconciliation.log
            test-artifacts/rehearsal-failure.log
            test-artifacts/ledger.log
            test-artifacts/pgtap.log
            test-artifacts/concurrency.log
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Final-source frontend and mocked Chromium validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Run frontend checks using reserved build-only configuration
        env:
          VITE_SUPABASE_URL: https://careconnect-ci-build.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
        run: npm run validate:frontend && npm run test:supabase-config
      - name: Install Chromium on the disposable runner
        run: npx playwright install --with-deps chromium
      - name: Run complete mocked Chromium suite with its own reserved configuration
        run: npx playwright test --project=chromium
