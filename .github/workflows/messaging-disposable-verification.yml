name: Messaging candidate disposable verification

on:
  push:
    branches:
      - codex/messaging-disposable-verification

permissions:
  contents: read

jobs:
  verify-messaging:
    # Publish this reviewed driver by its exact commit. Only the initial push
    # can run it, and the test changes are pinned separately.
    if: github.repository == 'h4timfr/care-connect-chennai' && github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUPERVISOR_SHA: 366ef27d728b623233cc414adeb4d558085fd8a4
      MESSAGING_SHA: 112c254accdc3d34250f86561787d560f18bc9db
      VERIFICATION_SHA: df34e2004ada66e4d3f2283d3f8351eff43a3ab8
    steps:
      - name: Require the reviewed workflow and a GitHub-hosted Linux runner
        shell: bash
        run: |
          set -euo pipefail
          ref=refs/heads/codex/messaging-disposable-verification
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]] || exit 78
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "$ref" ]] || exit 78
          [[ "$GITHUB_WORKFLOW_REF" == "h4timfr/care-connect-chennai/.github/workflows/messaging-disposable-verification.yml@$ref" &&
             "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || exit 78

      - name: Check out the approved supervisor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: h4timfr/care-connect-chennai
          ref: 366ef27d728b623233cc414adeb4d558085fd8a4
          path: trusted
          persist-credentials: false

      - name: Fetch the driver and pinned candidate as source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: h4timfr/care-connect-chennai
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 3
          persist-credentials: false

      - name: Verify commit ancestry and stage the bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C trusted rev-parse HEAD)" == "$SUPERVISOR_SHA" ]] || exit 78
          [[ "$(git -C source rev-parse HEAD)" == "$GITHUB_WORKFLOW_SHA" ]] || exit 78
          [[ "$(git -C source rev-list --parents -n 1 HEAD)" == "$GITHUB_SHA $VERIFICATION_SHA" ]] || exit 78
          [[ "$(git -C source rev-list --parents -n 1 "$VERIFICATION_SHA")" == "$VERIFICATION_SHA $MESSAGING_SHA" ]] || exit 78

          driver_diff=$(git -C source diff --no-renames --name-status "$VERIFICATION_SHA" HEAD)
          [[ "$driver_diff" == $'A\t.github/workflows/messaging-disposable-verification.yml\nM\tvercel.json' ]] || exit 78
          candidate_diff=$(git -C source diff --no-renames --name-status "$MESSAGING_SHA" "$VERIFICATION_SHA")
          [[ "$candidate_diff" == $'M\tscripts/real-service-integration.mjs\nM\tscripts/real-service-integration.test.mjs\nM\ttests/real-service/workflows.spec.ts' ]] || exit 78

          # Populate the disposable workspace from the immutable baseline.
          # Keep the three test edits as data until the verified test phase.
          umask 022
          mkdir workspace
          git -C source archive "$MESSAGING_SHA" | tar -xf - -C workspace
          umask 077
          vault=workspace/scripts/.messaging-verification
          mkdir "$vault" workspace/test-artifacts
          for file in \
            package-lock.json \
            scripts/ci-isolated-docker.sh \
            scripts/ci-docker-admission.mjs \
            scripts/ci-real-service-phase.sh \
            scripts/service-execution-boundary.mjs \
            scripts/real-service-integration.mjs \
            scripts/startup-evidence.mjs \
            scripts/startup-observer.mjs \
            scripts/verify-disposable-docker-bindings.mjs \
            scripts/local-sql-test-target.mjs \
            scripts/run-sql-ci-step.mjs; do
            [[ -f "workspace/$file" && ! -L "workspace/$file" ]] || exit 78
            cmp -s "trusted/$file" "workspace/$file" || exit 78
          done
          # This imported helper differs from 366ef27 only in the reviewed
          # migration/test inventory constants for the 00066–00067 schema.
          [[ "$(git hash-object workspace/scripts/staging-reconciliation-rehearsal.mjs)" == 46306330105d55586f6b55f786f79cc3dfcf114d ]] || exit 78

          for file in scripts/real-service-integration.mjs scripts/real-service-integration.test.mjs tests/real-service/workflows.spec.ts; do
            git -C source show "$VERIFICATION_SHA:$file" > "$vault/$(basename "$file")"
          done
          mv workspace/scripts/ci-real-service-phase.sh "$vault/phase.sh"
          cat > workspace/scripts/ci-real-service-phase.sh <<'BASH'
          #!/bin/bash
          set -euo pipefail
          vault=scripts/.messaging-verification
          if [[ "$1" == test ]]; then
            # The unchanged supervisor reaches this phase only after the
            # canary, binding verification, and egress removal.
            node scripts/service-execution-boundary.mjs check
            install -m 0644 "$vault/real-service-integration.mjs" scripts/real-service-integration.mjs
            install -m 0644 "$vault/real-service-integration.test.mjs" scripts/real-service-integration.test.mjs
            install -m 0644 "$vault/workflows.spec.ts" tests/real-service/workflows.spec.ts
          fi
          exec /bin/bash "$vault/phase.sh" "$@"
          BASH
          bash -n workspace/scripts/ci-real-service-phase.sh
          printf '{"workflow_sha":"%s","verification_sha":"%s","messaging_sha":"%s","supervisor_sha":"%s"}\n' \
            "$GITHUB_WORKFLOW_SHA" "$VERIFICATION_SHA" "$MESSAGING_SHA" "$SUPERVISOR_SHA" \
            > workspace/test-artifacts/messaging-verification-source.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install locked tools from approved source
        working-directory: trusted
        run: npm ci --no-audit --no-fund

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Install namespace transport and PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes slirp4netns postgresql-client

      - name: Install Chromium from the approved lockfile
        working-directory: trusted
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/careconnect-chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Validate approved boundary regressions
        working-directory: trusted
        run: node --test scripts/ci-docker-admission.test.mjs scripts/service-execution-boundary.test.mjs scripts/real-service-integration.test.mjs scripts/verify-disposable-docker-bindings.test.mjs scripts/startup-evidence.test.mjs scripts/startup-observer.test.mjs scripts/run-sql-ci-step.test.mjs scripts/local-sql-test-target.test.mjs

      - name: Prove isolation and run the pinned messaging candidate
        working-directory: workspace
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          mv ../trusted/node_modules ./node_modules
          cmp -s ../trusted/scripts/ci-isolated-docker.sh scripts/ci-isolated-docker.sh || exit 78
          cmp -s ../trusted/scripts/ci-docker-admission.mjs scripts/ci-docker-admission.mjs || exit 78
          cmp -s ../trusted/scripts/ci-real-service-phase.sh scripts/.messaging-verification/phase.sh || exit 78
          status=0
          sudo -n /bin/bash ../trusted/scripts/ci-isolated-docker.sh \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$(id -u)" "$(id -g)" \
            "$(pwd -P)" "$(command -v node)" "$(command -v supabase)" "$RUNNER_TEMP/careconnect-chromium" || status=$?
          if [[ ! -f test-artifacts/service-execution-boundary.json && "$status" == 78 ]]; then
            node scripts/service-execution-boundary.mjs
          fi
          exit "$status"

      - name: Upload sanitized integration evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careconnect-messaging-disposable-${{ github.run_id }}
          path: |
            workspace/test-artifacts/messaging-verification-source.json
            workspace/test-artifacts/service-execution-boundary.json
            workspace/test-artifacts/docker-pre-start-proof.json
            workspace/test-artifacts/startup.log
            workspace/test-artifacts/startup-process.json
            workspace/test-artifacts/startup-images-before.json
            workspace/test-artifacts/startup-evidence.json
            workspace/test-artifacts/startup-observer.json
            workspace/test-artifacts/startup-observer-cleanup.json
            workspace/test-artifacts/ledger.log
            workspace/test-artifacts/pgtap.log
            workspace/test-artifacts/concurrency.log
            workspace/test-artifacts/real-service-summary.json
            workspace/test-artifacts/browser-workflow-summary.json
            workspace/test-artifacts/browser-failure-trace.json
            workspace/test-artifacts/docker-network-summary.json
            workspace/test-artifacts/docker-network-cleanup-summary.json
            workspace/test-artifacts/docker-stop-summary.json
          if-no-files-found: warn
          retention-days: 7
