name: Security gates

on:
  pull_request:
  push:
    branches: [claude/careconnect-frontend-repair]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify artifact gate and tracked paths
        run: |
          node --test scripts/security-artifacts.test.mjs
          node scripts/security-artifacts.mjs --tracked
      - name: Scan the tracked snapshot and its reachable history
        shell: bash
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          snapshot=$(mktemp -d)
          git checkout-index --all --prefix="$snapshot/"
          docker pull "$GITLEAKS_IMAGE"
          scan() {
            local mode="$1" input="$2" status=0
            shift 2
            docker run --rm --network none --read-only --cap-drop ALL \
              --user "$(id -u):$(id -g)" --volume "$input:/repo:ro" --workdir /repo \
              "$GITLEAKS_IMAGE" "$mode" --config /repo/.gitleaks.toml \
              --no-banner --redact=100 --ignore-gitleaks-allow --exit-code=2 --timeout=180 \
              "$@" . >/dev/null 2>&1 || status=$?
            if [ "$status" -eq 2 ]; then
              echo "::error::Secrets detected in the $mode scan. Run the redacted local scan to triage."
              return 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::Gitleaks could not complete the $mode scan."
              return 1
            fi
          }
          scan dir "$snapshot"
          scan git "$GITHUB_WORKSPACE" --log-opts=HEAD
      - name: Audit direct and transitive npm dependencies
        run: npm audit --audit-level=high
