repos:
  - repo: local
    hooks:
      - id: private-artifact-paths
        name: Block private credential and backup files
        entry: node scripts/security-artifacts.mjs --tracked
        language: system
        pass_filenames: false
      - id: gitleaks
        name: Scan staged changes for secrets
        entry: gitleaks git --staged --redact=100 --no-banner --ignore-gitleaks-allow --config .gitleaks.toml .
        language: system
        pass_filenames: false
